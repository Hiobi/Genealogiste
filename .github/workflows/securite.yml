name: Sécurité

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets et distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier les fichiers suivis
        run: python3 scripts/verifier_distribution.py
      - name: Installer Gitleaks vérifié
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"; then
            gh release download v8.30.1 --repo gitleaks/gitleaks \
              --pattern gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz" --clobber
          fi
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scanner tout l’historique accessible
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" .'

  dependances:
    name: Dépendances Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.14'
          python-version: '3.11'
      - name: Exporter toutes les dépendances verrouillées
        run: uv --directory mcp export --locked --all-groups --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/requirements.txt"
      - name: Vérifier les avis de sécurité publics
        run: uvx pip-audit==2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
