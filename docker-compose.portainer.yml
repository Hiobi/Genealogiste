# Stack Portainer : serveur MCP genealogiste + Gramps Web (interface graphique).
# Portainer > Stacks > Add stack > Repository
#   URL : https://github.com/hiobi/sosa   Référence : refs/heads/feat/genealogiste
#   Compose path : docker-compose.portainer.yml
#   Variables : voir portainer/stack.env.example (ou « Load variables from .env file »)
#
# Le MCP n'a pas d'authentification : il reste sur 127.0.0.1 par défaut (tunnel SSH ou reverse proxy authentifié).
# Gramps Web a ses propres comptes : créer l'administrateur au premier accès, puis renseigner GRAMPS_USER/PASSWORD.
name: genealogiste

x-grampsweb: &grampsweb
  image: ghcr.io/gramps-project/grampsweb:${GRAMPSWEB_VERSION:-latest}
  restart: unless-stopped
  environment:
    GRAMPSWEB_TREE: ${GRAMPSWEB_TREE:-Genealogiste}
    GRAMPSWEB_BASE_URL: ${GRAMPSWEB_BASE_URL:-}
    GRAMPSWEB_CELERY_CONFIG__broker_url: redis://grampsweb_redis:6379/0
    GRAMPSWEB_CELERY_CONFIG__result_backend: redis://grampsweb_redis:6379/0
    GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb_redis:6379/1
  depends_on:
    - grampsweb_redis
  volumes:
    - gramps_users:/app/users
    - gramps_index:/app/indexdir
    - gramps_thumb_cache:/app/thumbnail_cache
    - gramps_cache:/app/cache
    - gramps_secret:/app/secret
    - gramps_db:/root/.gramps/grampsdb
    - gramps_media:/app/media
    - gramps_tmp:/tmp

services:
  mcp:
    build: ./mcp
    image: genealogiste-mcp:local
    restart: unless-stopped
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8765}:8765"
    environment:
      GENEALOGISTE_DATA_DIR: /data
      GENEALOGISTE_CACHE: /cache/cache.sqlite
      GENEALOGISTE_BACKEND: ${GENEALOGISTE_BACKEND:-fichier}
      GENEALOGISTE_GIT_MIRROR: ${GENEALOGISTE_GIT_MIRROR:-false}
      GENEALOGISTE_GIT_REMOTE: ${GENEALOGISTE_GIT_REMOTE:-}
      GENEALOGISTE_GRAMPS_URL: http://grampsweb:5000
      # MCP_BIND configurable : jeton exigé, sinon dérogation explicite (le conteneur refuse de démarrer)
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_SANS_AUTH: ${MCP_SANS_AUTH:-0}
      GENEALOGISTE_GRAMPS_USER: ${GENEALOGISTE_GRAMPS_USER:-}
      GENEALOGISTE_GRAMPS_PASSWORD: ${GENEALOGISTE_GRAMPS_PASSWORD:-}
      GENEALOGISTE_WIKITREE_APPID: ${GENEALOGISTE_WIKITREE_APPID:-}
      GENEALOGISTE_MATCHID_TOKEN: ${GENEALOGISTE_MATCHID_TOKEN:-}
      GENEALOGISTE_FS_USER: ${GENEALOGISTE_FS_USER:-}
      GENEALOGISTE_FS_PASSWORD: ${GENEALOGISTE_FS_PASSWORD:-}
      GENEALOGISTE_STRICT: ${GENEALOGISTE_STRICT:-0}
      GENEALOGISTE_EXIGER_SOURCE: ${GENEALOGISTE_EXIGER_SOURCE:-1}
      GENEALOGISTE_OFFLINE: ${GENEALOGISTE_OFFLINE:-0}
    volumes:
      # nom de volume (défaut) ou chemin absolu de l'hôte, ex. /srv/genealogie
      - ${GENEALOGISTE_DATA_PATH:-genealogiste_data}:/data
      - mcp_cache:/cache

  grampsweb:
    <<: *grampsweb
    ports:
      - "${GRAMPSWEB_BIND:-127.0.0.1}:${GRAMPSWEB_PORT:-5055}:5000"

  grampsweb_celery:
    <<: *grampsweb
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2

  grampsweb_redis:
    image: docker.io/library/redis:7.2-alpine
    restart: unless-stopped

volumes:
  genealogiste_data:
  mcp_cache:
  gramps_users:
  gramps_index:
  gramps_thumb_cache:
  gramps_cache:
  gramps_secret:
  gramps_db:
  gramps_media:
  gramps_tmp:
