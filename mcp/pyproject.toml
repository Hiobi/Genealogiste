[project]
name = "genealogiste-mcp"
version = "0.2.0"
description = "Serveur MCP du plugin Claude Code « genealogiste » : sources généalogiques françaises, arbre GEDCOM 7 versionné, méthodologie GPS."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.12,<2",
    "httpx>=0.27",
    "pillow>=10",
]

[project.optional-dependencies]
familysearch = ["getmyancestors>=1.0"]

[project.scripts]
genealogiste-mcp = "genealogiste_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genealogiste_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gramps_live: intégration sur un Gramps Web jetable (make test-gramps)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
